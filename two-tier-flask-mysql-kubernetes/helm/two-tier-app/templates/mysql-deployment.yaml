apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "two-tier-app.fullname" . }}-mysql
  labels:
    {{- include "two-tier-app.labels" . | nindent 4 }}
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      tier: database
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        tier: database
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "two-tier-app.fullname" . }}-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "two-tier-app.fullname" . }}-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "two-tier-app.fullname" . }}-config
                  key: MYSQL_DB
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "two-tier-app.fullname" . }}-config
                  key: MYSQL_USER
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: {{ include "two-tier-app.fullname" . }}-mysql-pvc
